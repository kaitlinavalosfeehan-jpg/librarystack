async upsertCollection(c) {

    .from("collections")
    .upsert(

// Convert snake_case DB rows to camelCase app objects
function rowToBook(r)       { return {isbn:r.isbn,title:r.title,author:r.author||"",genre:r.genre||"",ageRange:r.age_range||"Adult",pages:r.pages||0,format:r.format||"PB",msrp:parseFloat(r.msrp)||0}; }
function rowToLib(r)        { return {id:r.id,name:r.name,location:r.location||"",contact:r.contact||""}; }
function rowToCol(r)        { return {libraryId:r.library_id,isbn:r.isbn,qty:r.qty||0,condition:r.condition||"Good",lastInventory:r.last_inventory||null}; }
function rowToDelivery(r)   { return {id:r.id,libraryId:r.library_id,date:r.date,notes:r.notes||"",items:r.items||[]}; }
function rowToAudit(r)      { return {id:r.id,libraryId:r.library_id,date:r.date,scanned:r.scanned||{},expected:r.expected||{},delta:r.delta||[]}; }
function rowToQueue(r)      { return {isbn:r.isbn,queueDate:r.queue_date,notes:r.notes||""}; }

// ── CSV Export ──
function exportCSV(rows,filename){
  if(!rows.length)return;
  const hdr=Object.keys(rows[0]);
  const csv=[hdr.join(","),...rows.map(r=>hdr.map(k=>{const v=String(r[k]??"").replace(/"/g,'""');return v.includes(",")||v.includes('"')?`"${v}"`:v;}).join(","))].join("\n");
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=filename;a.click();
}

// ── Camera Scanner ──
function CameraScanner({onScan}){
  const videoRef=useRef(null);const streamRef=useRef(null);const animRef=useRef(null);const lastRef=useRef(null);
  const [status,setStatus]=useState("starting");const [err,setErr]=useState(null);const [torch,setTorch]=useState(false);const trackRef=useRef(null);
  useEffect(()=>{
    let det=null;
    async function go(){
      if(!("BarcodeDetector" in window)){setErr("Camera scanning requires Chrome 83+ on Android or Safari 17+ on iPhone. Use Physical Scanner mode instead.");setStatus("error");return;}
      try{det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});}catch(e){setErr("Barcode detector failed: "+e.message);setStatus("error");return;}
      try{
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}});
        streamRef.current=s;const tr=s.getVideoTracks()[0];
        if(tr){trackRef.current=tr;try{await tr.applyConstraints({advanced:[{torch:false}]});}catch{}}
        if(videoRef.current){videoRef.current.srcObject=s;await videoRef.current.play();}
        setStatus("scanning");
        function tick(){
          if(!videoRef.current||videoRef.current.readyState<2){animRef.current=requestAnimationFrame(tick);return;}
          det.detect(videoRef.current).then(b=>{if(b.length>0){const v=b[0].rawValue;if(v!==lastRef.current){lastRef.current=v;onScan(v);setTimeout(()=>{lastRef.current=null;},1500);}}}).catch(()=>{});
          animRef.current=requestAnimationFrame(tick);
        }
        animRef.current=requestAnimationFrame(tick);
      }catch(e){setErr("Camera access denied. Please allow camera permission in your browser settings.");setStatus("error");}
    }
    go();
    return()=>{if(animRef.current)cancelAnimationFrame(animRef.current);if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());};
  },[]);
  async function toggleTorch(){if(!trackRef.current)return;try{await trackRef.current.applyConstraints({advanced:[{torch:!torch}]});setTorch(v=>!v);}catch{}}
  return(
    <div>
      {status==="error"&&<div style={{background:"#FFF0F0",border:"0.5px solid #F7C1C1",borderRadius:10,padding:"0.75rem",fontSize:13,color:"#A32D2D"}}>{err}</div>}
      {status==="starting"&&<div style={{textAlign:"center",padding:"2rem",fontSize:13,color:"#666"}}>Starting camera...</div>}
      {status==="scanning"&&<div>
        <div className="camera-wrap"><video ref={videoRef} playsInline muted/><div className="scan-line"/><div className="corner-tl"/><div className="corner-tr"/><div className="corner-bl"/><div className="corner-br"/></div>
        <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:8}}><button onClick={toggleTorch} style={{fontSize:12,padding:"5px 12px"}}>{torch?"Torch OFF":"Torch ON"}</button></div>
        <p style={{textAlign:"center",fontSize:12,color:"#666",marginTop:6}}>Hold ISBN barcode steady in frame</p>
      </div>}
    </div>
  );
}

// ── Scan Input ──
function ScanInput({onScan,autoFocus=true}){
  const [mode,setMode]=useState("physical");const [val,setVal]=useState("");const inputRef=useRef(null);
  useEffect(()=>{if(mode==="physical"&&autoFocus&&inputRef.current)inputRef.current.focus();},[mode]);
  function handleKey(e){if(e.key==="Enter"&&val.trim()){onScan(val.trim());setVal("");}}
  return(
    <div>
      <div className="scan-mode-bar">
        <button className={`scan-mode-btn${mode==="physical"?" active":""}`} onClick={()=>setMode("physical")}>Physical Scanner / Keyboard</button>
        <button className={`scan-mode-btn${mode==="camera"?" active":""}`} onClick={()=>setMode("camera")}>Camera (Mobile)</button>
      </div>
      {mode==="physical"&&<div className={`scan-box${val.length>0?" active-scan":""}`} onClick={()=>inputRef.current&&inputRef.current.focus()}>
        <div style={{fontSize:12,color:"#666",marginBottom:8}}>Click here, then scan or type ISBN + Enter</div>
        <input ref={inputRef} value={val} onChange={e=>setVal(e.target.value)} onKeyDown={handleKey} placeholder="Ready to scan..." style={{maxWidth:260,textAlign:"center",fontSize:15,letterSpacing:2,border:"none",background:"transparent",boxShadow:"none"}} autoFocus={autoFocus}/>
      </div>}
      {mode==="camera"&&<CameraScanner onScan={isbn=>onScan(isbn.replace(/\D/g,""))}/>}
    </div>
  );
}

function CondBadge({c}){
  if(c==="Good")return<span className="cond-good">Good</span>;
  if(c==="Fair")return<span className="cond-fair">Fair</span>;
  if(c==="Poor")return<span className="cond-poor">Poor</span>;
  return<span className="badge badge-gray">{c||"—"}</span>;
}

// DASHBOARD
// ══════════════════════════════════════════════
function DashboardTab({books,libraries,collections,audits,deliveries}){
  const totalCopies=collections.reduce((s,c)=>s+c.qty,0);
  const totalMSRP=collections.reduce((s,c)=>{const b=books.find(x=>x.isbn===c.isbn);return s+(b?b.msrp*c.qty:0);},0);
  const poorCondition=collections.filter(c=>c.condition==="Poor");
  const lastAudits=libraries.map(lib=>{const a=[...audits].filter(x=>x.libraryId===lib.id).sort((a,b)=>b.date.localeCompare(a.date));return{lib,last:a[0]||null};});
  const totalMissing=lastAudits.reduce((s,{last})=>s+(last?last.delta.reduce((d,x)=>d+(x.missing||0),0):0),0);
  const msrpLost=lastAudits.reduce((s,{last})=>s+(last?last.delta.reduce((d,x)=>{const b=books.find(bk=>bk.isbn===x.isbn);return d+(b?b.msrp*(x.missing||0):0);},0):0),0);
  return(
    <div>
      <h2 className="section-title">Dashboard</h2>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:"1.5rem"}}>
        <div className="stat-card"><div className="stat-num">{libraries.length}</div><div className="stat-label">Libraries</div></div>
        <div className="stat-card"><div className="stat-num">{books.length}</div><div className="stat-label">Catalog Titles</div></div>
        <div className="stat-card"><div className="stat-num">{totalCopies}</div><div className="stat-label">Copies on Site</div></div>
        <div className="stat-card"><div className="stat-num">${Math.round(totalMSRP)}</div><div className="stat-label">MSRP on Site</div></div>
        <div className="stat-card" style={totalMissing>0?{background:"#F7C1C1"}:{}}><div className="stat-num" style={totalMissing>0?{color:"#791F1F"}:{}}>{totalMissing}</div><div className="stat-label" style={totalMissing>0?{color:"#A32D2D"}:{}}>Missing</div></div>
        <div className="stat-card" style={msrpLost>0?{background:"#FFF0D0"}:{}}><div className="stat-num" style={msrpLost>0?{color:"#633806"}:{}}>${msrpLost.toFixed(2)}</div><div className="stat-label" style={msrpLost>0?{color:"#854F0B"}:{}}>MSRP Taken</div></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:16}}>
        <div className="card">
          <div style={{fontSize:11,fontWeight:500,color:"#666",textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:"0.75rem"}}>Library Status</div>
          {libraries.length===0&&<div style={{fontSize:13,color:"#666"}}>No libraries yet.</div>}
          {libraries.map(lib=>{
            const cols=collections.filter(c=>c.libraryId===lib.id);const total=cols.reduce((s,c)=>s+c.qty,0);
            const lastAudit=lastAudits.find(x=>x.lib.id===lib.id)?.last;
            const missing=lastAudit?lastAudit.delta.reduce((s,x)=>s+(x.missing||0),0):0;
            const pct=totalCopies>0?Math.round(total/totalCopies*100):0;
            return(<div key={lib.id} style={{marginBottom:"0.75rem"}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}>
                <span style={{fontWeight:500}}>{lib.name}</span><span style={{color:"#666"}}>{total} copies</span>
              </div>
              <div className="mini-bar"><div className="mini-bar-fill" style={{width:pct+"%"}}/></div>
              <div style={{fontSize:11,color:"#666",marginTop:3,display:"flex",gap:10}}>
                <span>{lib.location}</span>
                {missing>0&&<span style={{color:"#A32D2D",fontWeight:500}}>{missing} missing</span>}
                {lastAudit&&<span>Audited: {lastAudit.date}</span>}
              </div>
            </div>);
          })}
        </div>
        <div className="card">
          <div style={{fontSize:11,fontWeight:500,color:"#666",textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:"0.75rem"}}>Condition Alerts</div>
          {poorCondition.length===0?<div style={{fontSize:13,color:"#666"}}>No poor-condition books flagged.</div>:poorCondition.slice(0,6).map(c=>{
            const book=books.find(b=>b.isbn===c.isbn);const lib=libraries.find(l=>l.id===c.libraryId);
            return(<div key={c.libraryId+c.isbn} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"0.5px solid rgba(0,0,0,0.08)"}}>
              <div><div style={{fontSize:13,fontWeight:500}}>{book?.title||c.isbn}</div><div style={{fontSize:11,color:"#666"}}>{lib?.name}</div></div>
              <CondBadge c="Poor"/>
            </div>);
          })}
        </div>
        <div className="card">
          <div style={{fontSize:11,fontWeight:500,color:"#666",textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:"0.75rem"}}>Recent Deliveries</div>
          {deliveries.length===0?<div style={{fontSize:13,color:"#666"}}>No deliveries logged yet.</div>:[...deliveries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(d=>{
            const lib=libraries.find(l=>l.id===d.libraryId);const total=d.items.reduce((s,i)=>s+i.qty,0);
            return(<div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"0.5px solid rgba(0,0,0,0.08)"}}>
              <div><div style={{fontSize:13,fontWeight:500}}>{lib?.name||"Unknown"}</div><div style={{fontSize:11,color:"#666"}}>{d.date} · {total} copies</div></div>
              <span className="badge badge-blue">{d.items.length} titles</span>
            </div>);
          })}
        </div>
      </div>
    </div>
  );
}

// LIBRARIES
// ══════════════════════════════════════════════
function LibrariesTab({libraries,setLibraries,collections,setCollections,books,flash}){
  const [showAdd,setShowAdd]=useState(false);const [detail,setDetail]=useState(null);
  const [form,setForm]=useState({name:"",location:"",contact:""});
  const [assignOpen,setAssignOpen]=useState(false);const [af,setAf]=useState({isbn:"",qty:1});const [bSearch,setBSearch]=useState("");
  const [saving,setSaving]=useState(false);

  async function addLib(){
    if(!form.name.trim())return;setSaving(true);
    const id="lib"+Date.now();const lib={id,...form};
    const {error}=await db.upsertLibrary(lib);
    if(!error){setLibraries(l=>[...l,lib]);setForm({name:"",location:"",contact:""});setShowAdd(false);flash("Library added");}
    setSaving(false);
  }
  async function delLib(id){
    if(!confirm("Remove library and all its collection data?"))return;
    await db.deleteLibrary(id);
    setLibraries(l=>l.filter(x=>x.id!==id));setCollections(c=>c.filter(x=>x.libraryId!==id));flash("Library removed");
  }
  function getC(lid){return collections.filter(c=>c.libraryId===lid)}
  function totalQ(lid){return getC(lid).reduce((s,c)=>s+c.qty,0)}
  async function assignBook(){
    if(!af.isbn||!detail)return;setSaving(true);
    const ex=collections.find(c=>c.libraryId===detail.id&&c.isbn===af.isbn);
    const col={libraryId:detail.id,isbn:af.isbn,qty:ex?ex.qty+Number(af.qty):Number(af.qty),condition:"Good",lastInventory:null};
    const {error}=await db.upsertCollection(col);
    if(!error){
      if(ex)setCollections(c=>c.map(x=>x.libraryId===detail.id&&x.isbn===af.isbn?{...x,qty:col.qty}:x));
      else setCollections(c=>[...c,col]);
      flash("Book assigned");
    }
    setAf({isbn:"",qty:1});setAssignOpen(false);setSaving(false);
  }
  async function updQty(lid,isbn,v){
    const n=parseInt(v);if(isNaN(n)||n<0)return;
    const col=collections.find(c=>c.libraryId===lid&&c.isbn===isbn);
    if(!col)return;const updated={...col,qty:n};
    await db.upsertCollection(updated);
    setCollections(c=>c.map(x=>x.libraryId===lid&&x.isbn===isbn?updated:x));
  }
  async function updCond(lid,isbn,cond){
    const col=collections.find(c=>c.libraryId===lid&&c.isbn===isbn);
    if(!col)return;const updated={...col,condition:cond};
    await db.upsertCollection(updated);
    setCollections(c=>c.map(x=>x.libraryId===lid&&x.isbn===isbn?updated:x));
    flash("Condition updated");
  }
  async function remFromLib(lid,isbn){
    await db.deleteCollection(lid,isbn);
    setCollections(c=>c.filter(x=>!(x.libraryId===lid&&x.isbn===isbn)));flash("Book removed");
  }
  const fbks=books.filter(b=>(b.title+b.author+b.isbn).toLowerCase().includes(bSearch.toLowerCase()));
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
        <h2 className="section-title" style={{margin:0}}>Partner Libraries</h2>
        <button className="btn-primary" onClick={()=>setShowAdd(true)}>+ Add Library</button>
      </div>
      {libraries.length===0&&<div className="empty-state"><p>No libraries yet. Add your first partner location.</p></div>}
      <div style={{display:"grid",gap:10}}>
        {libraries.map(lib=>{
          const cols=getC(lib.id);const poor=cols.filter(c=>c.condition==="Poor").length;
          return(<div key={lib.id} className="card" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
            <div style={{flex:1,cursor:"pointer"}} onClick={()=>setDetail(lib)}>
              <div style={{fontWeight:500,fontSize:15}}>{lib.name}</div>
              <div style={{fontSize:12,color:"#666",marginTop:2}}>{lib.location}{lib.contact&&<> · {lib.contact}</>}</div>
              <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}>
                <span className="badge badge-blue">{cols.length} titles</span>
                <span className="badge badge-gray">{totalQ(lib.id)} copies</span>
                {poor>0&&<span className="badge badge-red">{poor} poor condition</span>}
              </div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setDetail(lib)}>Manage</button>
              <button className="btn-danger" onClick={()=>delLib(lib.id)}>✕</button>
            </div>
          </div>);
        })}
      </div>
      {showAdd&&(<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setShowAdd(false)}}>
        <div className="modal">
          <div className="modal-title">Add Library</div>
          <div className="form-group"><label className="form-label">Name *</label><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Meridian Jet Center"/></div>
          <div className="form-group"><label className="form-label">Location</label><input value={form.location} onChange={e=>setForm(f=>({...f,location:e.target.value}))} placeholder="City, State"/></div>
          <div className="form-group"><label className="form-label">Contact</label><input value={form.contact} onChange={e=>setForm(f=>({...f,contact:e.target.value}))} placeholder="email or phone"/></div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={()=>setShowAdd(false)}>Cancel</button>
            <button className="btn-primary" onClick={addLib} disabled={saving}>{saving?"Saving...":"Add"}</button>
          </div>
        </div>
      </div>)}
      {detail&&(<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setDetail(null);setAssignOpen(false)}}}>
        <div className="modal" style={{maxWidth:620}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"1.25rem"}}>
            <div><div className="modal-title" style={{margin:0}}>{detail.name}</div><div style={{fontSize:12,color:"#666"}}>{detail.location}</div></div>
            <button onClick={()=>{setDetail(null);setAssignOpen(false)}} style={{fontSize:16}}>✕</button>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"0.75rem"}}>
            <span style={{fontSize:11,fontWeight:500,color:"#666",textTransform:"uppercase",letterSpacing:"0.4px"}}>Collection</span>
            <button className="btn-primary" style={{fontSize:12,padding:"5px 12px"}} onClick={()=>setAssignOpen(v=>!v)}>+ Assign Books</button>
          </div>
          {assignOpen&&(<div style={{background:"#f5f4f0",borderRadius:10,padding:"1rem",marginBottom:"1rem"}}>
            <div className="form-group" style={{marginBottom:"0.5rem"}}>
              <input value={bSearch} onChange={e=>setBSearch(e.target.value)} placeholder="Search title, author, ISBN..."/>
              {bSearch&&(<div style={{background:"#fff",border:"0.5px solid rgba(0,0,0,0.3)",borderRadius:8,marginTop:4,maxHeight:160,overflowY:"auto"}}>
                {fbks.length===0&&<div style={{padding:"10px 12px",fontSize:13,color:"#666"}}>No matches</div>}
                {fbks.map(b=><div key={b.isbn} style={{padding:"8px 12px",cursor:"pointer",fontSize:13,borderBottom:"0.5px solid rgba(0,0,0,0.08)"}} onClick={()=>{setAf(f=>({...f,isbn:b.isbn}));setBSearch("")}}><span style={{fontWeight:500}}>{b.title}</span> <span style={{color:"#666"}}>{b.author}</span></div>)}
              </div>)}
              {af.isbn&&!bSearch&&<div style={{marginTop:4,fontSize:12,color:"#185FA5",fontWeight:500}}>{books.find(b=>b.isbn===af.isbn)?.title}</div>}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
              <div><label className="form-label">Qty</label><input type="number" min="1" value={af.qty} onChange={e=>setAf(f=>({...f,qty:e.target.value}))} style={{width:72}}/></div>
              <button className="btn-success" onClick={assignBook} disabled={saving}>Add</button>
            </div>
          </div>)}
          {getC(detail.id).length===0&&<div style={{textAlign:"center",padding:"1.5rem",fontSize:13,color:"#666"}}>No books assigned.</div>}
          <div className="table-wrap">
            <table><thead><tr><th>Title</th><th>Fmt</th><th>MSRP</th><th>Qty</th><th>Condition</th><th></th></tr></thead>
            <tbody>{getC(detail.id).map(c=>{const bk=books.find(b=>b.isbn===c.isbn);if(!bk)return null;return(
              <tr key={c.isbn}>
                <td><div style={{fontWeight:500,fontSize:13}}>{bk.title}</div><div style={{fontSize:11,color:"#666"}}>{bk.author}</div></td>
                <td><span className="badge badge-gray">{bk.format}</span></td>
                <td>${bk.msrp.toFixed(2)}</td>
                <td><input type="number" min="0" value={c.qty} onChange={e=>updQty(detail.id,c.isbn,e.target.value)} style={{width:56,padding:"3px 6px",fontSize:12}}/></td>
                <td><select value={c.condition||"Good"} onChange={e=>updCond(detail.id,c.isbn,e.target.value)} style={{width:90,padding:"3px 6px",fontSize:12}}><option>Good</option><option>Fair</option><option>Poor</option></select></td>
                <td><button className="btn-danger" style={{padding:"3px 8px",fontSize:11}} onClick={()=>remFromLib(detail.id,c.isbn)}>✕</button></td>
              </tr>
            );})}
            </tbody></table>
          </div>
          {getC(detail.id).length>0&&<div style={{marginTop:"0.75rem",fontSize:12,color:"#666",display:"flex",gap:16}}>
            <span>Total copies: <strong>{totalQ(detail.id)}</strong></span>
            <span>MSRP on site: <strong>${getC(detail.id).reduce((s,c)=>{const b=books.find(x=>x.isbn===c.isbn);return s+(b?b.msrp*c.qty:0);},0).toFixed(2)}</strong></span>
          </div>}
        </div>
      </div>)}
    </div>
  );
}

function CatalogTab({books,setBooks,queue,setQueue,flash,collections,setCollections,libraries}){
  const [showAdd,setShowAdd]=useState(false);const [search,setSearch]=useState("");
  const [form,setForm]=useState({isbn:"",title:"",author:"",genre:"",ageRange:"Adult",pages:"",format:"PB",msrp:""});
  const [lookupTab,setLookupTab]=useState("title"); // "title" | "isbn" | "scan"
  // ISBN lookup state
  const [lISBN,setLISBN]=useState("");const [looking,setLooking]=useState(false);const [lRes,setLRes]=useState(null);
  // Title/author search state
  const [titleQuery,setTitleQuery]=useState("");const [searching,setSearching]=useState(false);const [searchResults,setSearchResults]=useState(null);const [searchErr,setSearchErr]=useState(null);
  const [saving,setSaving]=useState(false);
  const searchTimer=useRef(null);

  // Open Library title/author search
  async function searchBooks(q){
    if(!q.trim()){setSearchResults(null);setSearchErr(null);return;}
    setSearching(true);setSearchErr(null);
    try{
      const url=`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&fields=key,title,author_name,isbn,number_of_pages_median,subject&limit=10`;
      const r=await fetch(url);
      if(!r.ok)throw new Error("Search failed");
      const d=await r.json();
      const results=(d.docs||[]).filter(doc=>doc.isbn&&doc.isbn.length>0).map(doc=>({
        title:doc.title||"",
        author:(doc.author_name||[])[0]||"",
        isbn:(doc.isbn||[]).find(i=>i.length===13)||(doc.isbn||[])[0]||"",
        pages:doc.number_of_pages_median||"",
        subjects:(doc.subject||[]).slice(0,3),
      }));
      setSearchResults(results);
    }catch(e){setSearchErr("Search failed — check your connection.");}
    setSearching(false);
  }

  function handleTitleInput(e){
    const q=e.target.value;setTitleQuery(q);
    clearTimeout(searchTimer.current);
    if(q.trim().length>=2)searchTimer.current=setTimeout(()=>searchBooks(q),500);
    else{setSearchResults(null);setSearchErr(null);}
  }

  function fillFromResult(result){
    setForm(f=>({...f,isbn:result.isbn,title:result.title,author:result.author,pages:result.pages||""}));
    setSearchResults(null);setTitleQuery("");
    flash("Details filled in — review and save");
  }

  async function lookupISBN(){
    if(!lISBN.trim())return;setLooking(true);setLRes(null);
    try{const r=await fetch(`https://openlibrary.org/isbn/${lISBN.trim()}.json`);
      if(r.ok){const d=await r.json();let author="";
        if(d.authors?.[0]){try{const ar=await fetch(`https://openlibrary.org${d.authors[0].key}.json`);const ad=await ar.json();author=ad.name||"";}catch{}}
        setForm(f=>({...f,isbn:lISBN.trim(),title:d.title||"",author,pages:d.number_of_pages||""}));setLRes("found");
      }else setLRes("notfound");
    }catch{setLRes("notfound");}setLooking(false);
  }

  async function addBook(){
    if(!form.isbn||!form.title)return;
    if(books.find(b=>b.isbn===form.isbn)){alert("ISBN already in catalog.");return;}
    setSaving(true);
    const book={...form,pages:Number(form.pages)||0,msrp:Number(form.msrp)||0};
    const {error}=await db.upsertBook(book);
    if(!error){
      setBooks(b=>[...b,book]);
      setForm({isbn:"",title:"",author:"",genre:"",ageRange:"Adult",pages:"",format:"PB",msrp:""});
      setLISBN("");setLRes(null);setTitleQuery("");setSearchResults(null);
      setShowAdd(false);flash("Book added to catalog");
    }
    setSaving(false);
  }
  async function delBook(isbn){
    if(!confirm("Remove from catalog?"))return;
    await db.deleteBook(isbn);setBooks(b=>b.filter(x=>x.isbn!==isbn));flash("Book removed");
  }
  async function addToQueue(book){
    if(queue.find(q=>q.isbn===book.isbn))return;
    const item={isbn:book.isbn,queueDate:TODAY,notes:""};
    await db.upsertQueue(item);setQueue(q=>[...q,item]);flash("Added to queue");
  }
  function handleScanToAdd(isbn){
    setLISBN(isbn.replace(/\D/g,""));setLookupTab("isbn");setShowAdd(true);
  }

            <div style={{fontSize:11,fontWeight:500,color:"#666",textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:"0.75rem"}}>Book Details</div>

            <div className="form-group"><label className="form-label">Title *</label><input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/></div>
            <div className="form-group"><label className="form-label">Author</label><input value={form.author} onChange={e=>setForm(f=>({...f,author:e.target.value}))}/></div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Genre</label><input value={form.genre} onChange={e=>setForm(f=>({...f,genre:e.target.value}))}/></div>
              <div className="form-group"><label className="form-label">Age Range</label><select value={form.ageRange} onChange={e=>setForm(f=>({...f,ageRange:e.target.value}))}><option>Children</option><option>Middle Grade</option><option>Young Adult</option><option>Adult</option></select></div>
            </div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Format</label><select value={form.format} onChange={e=>setForm(f=>({...f,format:e.target.value}))}><option value="HC">Hardcover</option><option value="PB">Paperback</option></select></div>
              <div className="form-group"><label className="form-label">Pages</label><input type="number" value={form.pages} onChange={e=>setForm(f=>({...f,pages:e.target.value}))} placeholder="320"/></div>
            </div>
            <div className="form-group"><label className="form-label">MSRP ($)</label><input type="number" step="0.01" value={form.msrp} onChange={e=>setForm(f=>({...f,msrp:e.target.value}))} placeholder="18.00"/></div>
          </div>

          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:"0.5rem"}}>
            <button onClick={()=>setShowAdd(false)}>Cancel</button>
            <button className="btn-primary" onClick={addBook} disabled={saving||!form.isbn||!form.title}>{saving?"Saving...":"Add to Catalog"}</button>
          </div>
        </div>
      </div>)}
    </div>
  );
}

// AUDIT
// ══════════════════════════════════════════════
function AuditTab({libraries,collections,setCollections,books,audits,setAudits,flash}){
  const [step,setStep]=useState("select");const [lib,setLib]=useState(null);
  const [scanned,setScanned]=useState({});const [lastScan,setLastScan]=useState(null);const [done,setDone]=useState(false);const [saving,setSaving]=useState(false);

  function startAudit(l){setLib(l);setScanned({});setLastScan(null);setDone(false);setStep("scan");}
  function processISBN(raw){
    const isbn=raw.replace(/[^0-9X]/gi,"").trim();if(!isbn||isbn.length<8)return;
    const inLib=!!collections.find(c=>c.libraryId===lib.id&&c.isbn===isbn);
    const book=books.find(b=>b.isbn===isbn);
    setScanned(s=>({...s,[isbn]:(s[isbn]||0)+1}));
    setLastScan({isbn,book,inLib,time:Date.now()});
  }
  function getExp(){return collections.filter(c=>c.libraryId===lib?.id)}
  function getDelta(){
    const exp=getExp();const all=new Set([...exp.map(c=>c.isbn),...Object.keys(scanned)]);
    return Array.from(all).map(isbn=>{
      const e=exp.find(c=>c.isbn===isbn);const cnt=scanned[isbn]||0;const eq=e?e.qty:0;const d=eq-cnt;
      return{isbn,book:books.find(b=>b.isbn===isbn),expected:eq,scanned:cnt,delta:d,status:eq===0?"unknown":d===0?"ok":d>0?"missing":"over"};
    }).sort((a,b)=>{const o={missing:0,unknown:1,over:2,ok:3};return o[a.status]-o[b.status];});
  }
  async function finish(){
    setSaving(true);
    const delta=getDelta();
    const id="aud"+Date.now();
    const missingItems=delta.filter(d=>d.status==="missing").map(d=>({isbn:d.isbn,missing:d.delta}));
    const audit={id,libraryId:lib.id,date:TODAY,scanned:{...scanned},expected:Object.fromEntries(getExp().map(c=>[c.isbn,c.qty])),delta:missingItems};
    await db.insertAudit(audit);
    setAudits(a=>[...a,audit]);
    // update last_inventory on all collection items for this lib
    const updated=collections.map(c=>c.libraryId===lib.id?{...c,lastInventory:TODAY}:c);
    await Promise.all(collections.filter(c=>c.libraryId===lib.id).map(c=>db.upsertCollection({...c,lastInventory:TODAY})));
    setCollections(updated);
    setSaving(false);setDone(true);flash("Audit saved");
  }
  function reset(){setStep("select");setLib(null);setScanned({});setDone(false);}
  function exportAudit(){exportCSV(getDelta().map(d=>({Title:d.book?.title||"Unknown",Author:d.book?.author||"",ISBN:d.isbn,Expected:d.expected,Scanned:d.scanned,Delta:d.delta*-1,Status:d.status,MSRP:d.book?.msrp||""})),`audit_${lib?.name.replace(/\s+/g,"_")}_${TODAY}.csv`);}

  const delta=lib?getDelta():[];
  const totalSc=Object.values(scanned).reduce((s,n)=>s+n,0);
  const totalEx=getExp().reduce((s,c)=>s+c.qty,0);
  const missing=delta.filter(d=>d.status==="missing");
  const unknown=delta.filter(d=>d.status==="unknown");
  const ok=delta.filter(d=>d.status==="ok");
  const msrpLost=missing.reduce((s,d)=>s+(d.book?d.book.msrp*d.delta:0),0);

  if(step==="select")return(
    <div>
      <h2 className="section-title">Start Inventory Audit</h2>
      <p style={{fontSize:13,color:"#666",marginBottom:"1.25rem"}}>Select a partner location to begin scanning.</p>
      <div style={{display:"grid",gap:10}}>
        {libraries.map(lib=>{
          const cols=collections.filter(c=>c.libraryId===lib.id);
          const lastDate=cols.reduce((l,c)=>c.lastInventory&&c.lastInventory>l?c.lastInventory:l,"");
          return(<div key={lib.id} className="card" style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>startAudit(lib)}>
            <div>
              <div style={{fontWeight:500}}>{lib.name}</div>
              <div style={{fontSize:12,color:"#666"}}>{lib.location}</div>
              <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}>
                <span className="badge badge-blue">{cols.length} titles</span>
                <span className="badge badge-gray">{cols.reduce((s,c)=>s+c.qty,0)} expected</span>
                {lastDate&&<span className="badge badge-amber">Last: {lastDate}</span>}
              </div>
            </div>
            <button className="btn-primary">Start →</button>
          </div>);
        })}
      </div>
    </div>
  );

  if(done)return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
        <div><h2 className="section-title" style={{margin:0}}>Audit Report — {lib?.name}</h2><div style={{fontSize:12,color:"#666"}}>{TODAY}</div></div>
        <div style={{display:"flex",gap:8}}><button onClick={exportAudit}>Export CSV</button><button onClick={reset}>← New Audit</button></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:"1.5rem"}}>
        <div className="stat-card"><div className="stat-num">{totalSc}</div><div className="stat-label">Scanned</div></div>
        <div className="stat-card"><div className="stat-num">{totalEx}</div><div className="stat-label">Expected</div></div>
        <div className="stat-card" style={missing.length>0?{background:"#F7C1C1"}:{}}><div className="stat-num" style={missing.length>0?{color:"#791F1F"}:{}}>{missing.reduce((s,d)=>s+d.delta,0)}</div><div className="stat-label" style={missing.length>0?{color:"#A32D2D"}:{}}>Missing</div></div>
        <div className="stat-card" style={msrpLost>0?{background:"#F7C1C1"}:{}}><div className="stat-num" style={msrpLost>0?{color:"#791F1F"}:{}}>${msrpLost.toFixed(2)}</div><div className="stat-label" style={msrpLost>0?{color:"#A32D2D"}:{}}>MSRP Taken</div></div>
      </div>
      {missing.length>0&&<><div style={{fontSize:11,fontWeight:500,color:"#791F1F",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.4px"}}>Missing stock</div>
        <div className="table-wrap" style={{marginBottom:"1.25rem"}}><table><thead><tr><th>Title</th><th>Expected</th><th>Scanned</th><th>Missing</th><th>MSRP Loss</th></tr></thead>
        <tbody>{missing.map(d=><tr key={d.isbn}><td><div style={{fontWeight:500}}>{d.book?.title||d.isbn}</div><div style={{fontSize:11,color:"#666"}}>{d.book?.author}</div></td><td>{d.expected}</td><td>{d.scanned}</td><td><span style={{color:"#A32D2D",fontWeight:500}}>-{d.delta}</span></td><td style={{color:"#A32D2D"}}>${(d.book?d.book.msrp*d.delta:0).toFixed(2)}</td></tr>)}</tbody></table></div></>}
      {unknown.length>0&&<><div style={{fontSize:11,fontWeight:500,color:"#854F0B",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.4px"}}>Unknown stock</div>
        <div className="table-wrap" style={{marginBottom:"1.25rem"}}><table><thead><tr><th>ISBN</th><th>Title</th><th>Count</th></tr></thead>
        <tbody>{unknown.map(d=><tr key={d.isbn}><td style={{fontFamily:"monospace",fontSize:11}}>{d.isbn}</td><td>{d.book?.title||<span style={{color:"#666"}}>Not in catalog</span>}</td><td>{d.scanned}</td></tr>)}</tbody></table></div></>}
      {ok.length>0&&<><div style={{fontSize:11,fontWeight:500,color:"#27500A",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.4px"}}>Fully accounted</div>
        <div className="table-wrap"><table><thead><tr><th>Title</th><th>Status</th></tr></thead>
        <tbody>{ok.map(d=><tr key={d.isbn}><td>{d.book?.title||d.isbn}</td><td><span className="badge badge-green">{d.scanned}/{d.expected} ✓</span></td></tr>)}</tbody></table></div></>}
    </div>
  );

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
        <div><h2 className="section-title" style={{margin:0}}>Auditing: {lib?.name}</h2><div style={{fontSize:12,color:"#666"}}>{lib?.location}</div></div>
        <button onClick={reset}>← Change</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:10,marginBottom:"1.25rem"}}>
        <div className="stat-card"><div className="stat-num">{totalSc}</div><div className="stat-label">Scanned</div></div>
        <div className="stat-card"><div className="stat-num">{totalEx}</div><div className="stat-label">Expected</div></div>
        <div className="stat-card"><div className="stat-num">{Object.keys(scanned).length}</div><div className="stat-label">Unique</div></div>
        <div className="stat-card" style={missing.length>0?{background:"#F7C1C1"}:{}}><div className="stat-num" style={missing.length>0?{color:"#791F1F"}:{}}>{missing.length}</div><div className="stat-label" style={missing.length>0?{color:"#A32D2D"}:{}}>Short</div></div>
      </div>
      {lastScan&&<div className={`scan-toast${lastScan.inLib?" ok":" warn"}`}>{lastScan.inLib?`✓ ${lastScan.book?.title||lastScan.isbn} — ${scanned[lastScan.isbn]} scanned`:`⚠ Unknown: ${lastScan.isbn}`}</div>}
      <div className="card" style={{marginBottom:"1.25rem"}}><ScanInput onScan={processISBN}/></div>
      {delta.length>0&&<div className="table-wrap" style={{marginBottom:"1.25rem"}}>
        <table><thead><tr><th>Title</th><th>Scanned</th><th>Expected</th><th>Status</th></tr></thead>
        <tbody>{delta.map(d=>(
          <tr key={d.isbn} style={d.status==="missing"?{background:"rgba(242,193,193,0.2)"}:d.status==="unknown"?{background:"rgba(250,199,117,0.15)"}:{}}>
            <td><div style={{fontWeight:500}}>{d.book?.title||"Unknown"}</div><div style={{fontSize:11,color:"#666",fontFamily:"monospace"}}>{d.isbn}</div></td>
            <td style={{fontWeight:500}}>{d.scanned}</td><td>{d.expected||"—"}</td>
            <td>{d.status==="ok"&&<span className="badge badge-green">✓</span>}{d.status==="missing"&&<span className="badge badge-red">-{d.delta} missing</span>}{d.status==="over"&&<span className="badge badge-blue">+{Math.abs(d.delta)} extra</span>}{d.status==="unknown"&&<span className="badge badge-amber">Unknown</span>}</td>
          </tr>
        ))}</tbody></table>
      </div>}
      {delta.length===0&&<div className="empty-state" style={{padding:"1.5rem"}}><p style={{fontSize:13}}>Scan first book to begin.</p></div>}
      <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
        <button onClick={reset}>Discard</button>
        <button className="btn-success" onClick={finish} disabled={Object.keys(scanned).length===0||saving}>{saving?"Saving...":"Finish & Generate Report →"}</button>
      </div>
    </div>
  );
}

// DELIVERIES
// ══════════════════════════════════════════════
function DeliveriesTab({libraries,deliveries,setDeliveries,collections,setCollections,books,flash}){
  const [showAdd,setShowAdd]=useState(false);const [form,setForm]=useState({libraryId:"",date:TODAY,notes:""});
  const [items,setItems]=useState([]);const [bSearch,setBSearch]=useState("");const [filterLib,setFilterLib]=useState("");const [saving,setSaving]=useState(false);

  function addItem(isbn){
    const clean=isbn.replace(/\D/g,"");if(!clean)return;
    const ex=items.find(i=>i.isbn===clean);
    if(ex)setItems(it=>it.map(i=>i.isbn===clean?{...i,qty:i.qty+1}:i));
    else{const bk=books.find(b=>b.isbn===clean);setItems(it=>[...it,{isbn:clean,title:bk?.title||"Unknown",qty:1}]);}
    setBSearch("");
  }
  async function saveDelivery(){
    if(!form.libraryId||items.length===0)return;setSaving(true);
    const id="del"+Date.now();const delivery={id,libraryId:form.libraryId,date:form.date,notes:form.notes,items:[...items]};
    await db.insertDelivery(delivery);setDeliveries(d=>[delivery,...d]);
    for(const item of items){
      const ex=collections.find(c=>c.libraryId===form.libraryId&&c.isbn===item.isbn);
      const col={libraryId:form.libraryId,isbn:item.isbn,qty:ex?ex.qty+item.qty:item.qty,condition:"Good",lastInventory:null};
      await db.upsertCollection(col);
      if(ex)setCollections(c=>c.map(x=>x.libraryId===form.libraryId&&x.isbn===item.isbn?{...x,qty:col.qty}:x));
      else setCollections(c=>[...c,col]);
    }
    setForm({libraryId:"",date:TODAY,notes:""});setItems([]);setShowAdd(false);setSaving(false);flash("Delivery logged");
  }
  async function delDelivery(id){if(!confirm("Delete this delivery log?"))return;await db.deleteDelivery(id);setDeliveries(d=>d.filter(x=>x.id!==id));flash("Delivery removed");}
  function exportDeliveries(){
    const rows=filtered.flatMap(d=>{const lib=libraries.find(l=>l.id===d.libraryId);return d.items.map(i=>{const bk=books.find(b=>b.isbn===i.isbn);return{Date:d.date,Library:lib?.name||d.libraryId,ISBN:i.isbn,Title:bk?.title||"Unknown",Qty:i.qty,Notes:d.notes};});});
    if(rows.length)exportCSV(rows,"deliveries_export.csv");
  }
  const filtered=[...deliveries].filter(d=>!filterLib||d.libraryId===filterLib).sort((a,b)=>b.date.localeCompare(a.date));
  const filtBks=books.filter(b=>(b.title+b.isbn).toLowerCase().includes(bSearch.toLowerCase()));
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem",gap:10}}>
        <h2 className="section-title" style={{margin:0}}>Delivery Log</h2>
        <div style={{display:"flex",gap:8}}><button onClick={exportDeliveries}>Export CSV</button><button className="btn-primary" onClick={()=>setShowAdd(true)}>+ Log Delivery</button></div>
      </div>
      <select value={filterLib} onChange={e=>setFilterLib(e.target.value)} style={{maxWidth:220,marginBottom:"1rem"}}>
        <option value="">All Libraries</option>{libraries.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
      </select>
      {filtered.length===0&&<div className="empty-state"><p>No deliveries logged yet.</p></div>}
      <div style={{display:"grid",gap:10}}>
        {filtered.map(d=>{
          const lib=libraries.find(l=>l.id===d.libraryId);const total=d.items.reduce((s,i)=>s+i.qty,0);
          const msrp=d.items.reduce((s,i)=>{const bk=books.find(b=>b.isbn===i.isbn);return s+(bk?bk.msrp*i.qty:0);},0);
          return(<div key={d.id} className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontWeight:500,fontSize:14}}>{lib?.name||"Unknown"}</div>
                <div style={{fontSize:12,color:"#666"}}>{d.date}{d.notes&&<> · {d.notes}</>}</div>
                <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}>
                  <span className="badge badge-blue">{d.items.length} titles</span>
                  <span className="badge badge-gray">{total} copies</span>
                  <span className="badge badge-green">MSRP ${msrp.toFixed(2)}</span>
                </div>
              </div>
              <button className="btn-danger" style={{padding:"4px 8px",fontSize:11}} onClick={()=>delDelivery(d.id)}>✕</button>
            </div>
            <div style={{marginTop:"0.75rem",display:"flex",flexWrap:"wrap",gap:6}}>
              {d.items.map(i=>{const bk=books.find(b=>b.isbn===i.isbn);return<span key={i.isbn} style={{fontSize:12,background:"#f5f4f0",padding:"2px 8px",borderRadius:6}}>{bk?.title||i.isbn} ×{i.qty}</span>;})}
            </div>
          </div>);
        })}
      </div>
      {showAdd&&(<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setShowAdd(false)}}>
        <div className="modal" style={{maxWidth:560}}>
          <div className="modal-title">Log New Delivery</div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Library *</label>
              <select value={form.libraryId} onChange={e=>setForm(f=>({...f,libraryId:e.target.value}))}><option value="">— select —</option>{libraries.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</select>
            </div>
            <div className="form-group"><label className="form-label">Date</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
          </div>
          <div className="form-group"><label className="form-label">Notes</label><input value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="e.g. Holiday refresh, post-audit restock..."/></div>
          <div className="form-group">
            <label className="form-label">Add Books</label>
            <ScanInput onScan={addItem} autoFocus={false}/>
            <input value={bSearch} onChange={e=>setBSearch(e.target.value)} placeholder="Or search to add..." style={{marginTop:8}}/>
            {bSearch&&<div style={{background:"#fff",border:"0.5px solid rgba(0,0,0,0.3)",borderRadius:8,marginTop:4,maxHeight:130,overflowY:"auto"}}>
              {filtBks.length===0&&<div style={{padding:"8px 12px",fontSize:13,color:"#666"}}>No matches</div>}
              {filtBks.map(b=><div key={b.isbn} style={{padding:"8px 12px",cursor:"pointer",fontSize:13,borderBottom:"0.5px solid rgba(0,0,0,0.08)"}} onClick={()=>addItem(b.isbn)}><span style={{fontWeight:500}}>{b.title}</span> <span style={{color:"#666"}}>{b.author}</span></div>)}
            </div>}
          </div>
          {items.length>0&&<div style={{marginBottom:"1rem"}}>
            {items.map(i=>(<div key={i.isbn} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"0.5px solid rgba(0,0,0,0.08)"}}>
              <span style={{flex:1,fontSize:13,fontWeight:500}}>{i.title}</span>
              <input type="number" min="1" value={i.qty} onChange={e=>{const n=parseInt(e.target.value);if(!isNaN(n)&&n>0)setItems(it=>it.map(x=>x.isbn===i.isbn?{...x,qty:n}:x));}} style={{width:56,padding:"3px 6px",fontSize:12}}/>
              <button className="btn-danger" style={{padding:"3px 8px",fontSize:11}} onClick={()=>setItems(it=>it.filter(x=>x.isbn!==i.isbn))}>✕</button>
            </div>))}
            <div style={{marginTop:8,fontSize:12,color:"#666"}}>{items.reduce((s,i)=>s+i.qty,0)} copies · MSRP ${items.reduce((s,i)=>{const bk=books.find(b=>b.isbn===i.isbn);return s+(bk?bk.msrp*i.qty:0);},0).toFixed(2)}</div>
          </div>}
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={()=>setShowAdd(false)}>Cancel</button>
            <button className="btn-success" onClick={saveDelivery} disabled={!form.libraryId||items.length===0||saving}>{saving?"Saving...":"Save Delivery"}</button>
          </div>
        </div>
      </div>)}
    </div>
  );
}

// BILLING
// ══════════════════════════════════════════════
function BillingTab({libraries,audits,books}){
  const [filterLib,setFilterLib]=useState("");
  const billingData=libraries.map(lib=>{
    const libAudits=audits.filter(a=>a.libraryId===lib.id).sort((a,b)=>b.date.localeCompare(a.date));
    const byISBN={};
    libAudits.flatMap(a=>a.delta).forEach(({isbn,missing})=>{byISBN[isbn]=(byISBN[isbn]||0)+missing;});
    const lineItems=Object.entries(byISBN).map(([isbn,qty])=>{const bk=books.find(b=>b.isbn===isbn);return{isbn,title:bk?.title||isbn,msrp:bk?.msrp||0,qty,total:(bk?.msrp||0)*qty};});
    return{lib,libAudits,lineItems,totalBilled:lineItems.reduce((s,l)=>s+l.total,0),lastAudit:libAudits[0]};
  }).filter(x=>!filterLib||x.lib.id===filterLib);
  function exportBilling(){
    const rows=billingData.flatMap(({lib,lineItems})=>lineItems.map(l=>({Library:lib.name,Location:lib.location,ISBN:l.isbn,Title:l.title,Qty:l.qty,MSRP:l.msrp.toFixed(2),LineTotal:l.total.toFixed(2)})));
    if(rows.length)exportCSV(rows,"billing_summary.csv");
  }
  const grandTotal=billingData.reduce((s,x)=>s+x.totalBilled,0);
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem",gap:10}}>
        <div><h2 className="section-title" style={{margin:0}}>Client Billing Summary</h2><div style={{fontSize:12,color:"#666",marginTop:2}}>MSRP of books taken per location across all audits</div></div>
        <button onClick={exportBilling}>Export CSV</button>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:"1rem",alignItems:"center"}}>
        <select value={filterLib} onChange={e=>setFilterLib(e.target.value)} style={{maxWidth:220}}><option value="">All Libraries</option>{libraries.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</select>
        <div style={{fontSize:13,fontWeight:500,marginLeft:"auto"}}>Grand Total: <span style={{color:"#185FA5"}}>${grandTotal.toFixed(2)}</span></div>
      </div>
      {billingData.length===0&&<div className="empty-state"><p>No billing data yet. Complete an audit first.</p></div>}
      {billingData.map(({lib,lineItems,totalBilled,lastAudit,libAudits})=>(
        <div key={lib.id} className="card" style={{marginBottom:"1rem"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"0.75rem"}}>
            <div>
              <div style={{fontWeight:500,fontSize:15}}>{lib.name}</div>
              <div style={{fontSize:12,color:"#666"}}>{lib.location}{lib.contact&&<> · {lib.contact}</>}</div>
              <div style={{fontSize:11,color:"#666",marginTop:2}}>{libAudits.length} audit(s){lastAudit&&<> · Last: {lastAudit.date}</>}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:20,fontWeight:500,color:totalBilled>0?"#A32D2D":"#27500A"}}>${totalBilled.toFixed(2)}</div>
              <div style={{fontSize:11,color:"#666"}}>billable</div>
            </div>
          </div>
          {lineItems.length===0?<div style={{fontSize:13,color:"#666"}}>No missing books — nothing to bill.</div>:(
            <div className="table-wrap"><table><thead><tr><th>Title</th><th>ISBN</th><th>MSRP</th><th>Qty Taken</th><th>Line Total</th></tr></thead>
            <tbody>{lineItems.map(l=>(<tr key={l.isbn}><td style={{fontWeight:500}}>{l.title}</td><td style={{fontFamily:"monospace",fontSize:11}}>{l.isbn}</td><td>${l.msrp.toFixed(2)}</td><td>{l.qty}</td><td style={{fontWeight:500,color:"#A32D2D"}}>${l.total.toFixed(2)}</td></tr>))}</tbody></table></div>
          )}
        </div>
      ))}
    </div>
  );
}

// RESTOCK
// ══════════════════════════════════════════════
function RestockTab({libraries,audits,books,collections,queue,setQueue,flash}){
  const [filterLib,setFilterLib]=useState("");const THRESHOLD=2;
  const restockItems=libraries.flatMap(lib=>{
    const libCols=collections.filter(c=>c.libraryId===lib.id);
    const lastAudit=audits.filter(a=>a.libraryId===lib.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return libCols.filter(c=>{
      const missing=lastAudit?lastAudit.delta.find(d=>d.isbn===c.isbn)?.missing||0:0;
      return c.qty<=THRESHOLD||missing>0||c.condition==="Poor";
    }).map(c=>{
      const bk=books.find(b=>b.isbn===c.isbn);
      const missing=lastAudit?lastAudit.delta.find(d=>d.isbn===c.isbn)?.missing||0:0;
      const reasons=[];
      if(c.qty<=THRESHOLD)reasons.push(`Low stock (${c.qty} left)`);
      if(missing>0)reasons.push(`${missing} taken last audit`);
      if(c.condition==="Poor")reasons.push("Poor condition");
      return{lib,col:c,book:bk,missing,reasons,suggestedQty:Math.max(missing,(THRESHOLD+1)-c.qty,1)};
    });
  }).filter(x=>!filterLib||x.lib.id===filterLib);

  async function addToQueue(item){
    if(!item.book||queue.find(q=>q.isbn===item.book.isbn))return;
    const qItem={isbn:item.book.isbn,queueDate:TODAY,notes:`Restock for ${item.lib.name} — ${item.reasons.join(", ")}`};
    await db.upsertQueue(qItem);setQueue(q=>[...q,qItem]);flash("Added to queue");
  }
  async function addAllToQueue(){
    for(const item of restockItems.filter(i=>i.book&&!queue.find(q=>q.isbn===i.book?.isbn)))await addToQueue(item);
  }
  function exportRestock(){exportCSV(restockItems.map(i=>({Library:i.lib.name,Title:i.book?.title||i.col.isbn,ISBN:i.col.isbn,CurrentQty:i.col.qty,Missing:i.missing,Condition:i.col.condition,Reasons:i.reasons.join("; "),SuggestedReorder:i.suggestedQty,MSRP:i.book?.msrp||""})),"restock_list.csv");}
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem",gap:10}}>
        <div><h2 className="section-title" style={{margin:0}}>Restock List</h2><div style={{fontSize:12,color:"#666",marginTop:2}}>Low stock, recent losses, and poor condition flags</div></div>
        <div style={{display:"flex",gap:8}}><button onClick={exportRestock}>Export CSV</button><button className="btn-amber" onClick={addAllToQueue} disabled={restockItems.length===0}>Add All to Queue</button></div>
      </div>
      <select value={filterLib} onChange={e=>setFilterLib(e.target.value)} style={{maxWidth:220,marginBottom:"1rem"}}><option value="">All Libraries</option>{libraries.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</select>
      {restockItems.length===0&&<div className="empty-state"><p>No restock items flagged. All libraries are well-stocked.</p></div>}
      <div className="table-wrap">
        <table><thead><tr><th>Title</th><th>Library</th><th>On Hand</th><th>Condition</th><th>Reasons</th><th>Qty</th><th></th></tr></thead>
        <tbody>{restockItems.map((item,i)=>(
          <tr key={i}>
            <td><div style={{fontWeight:500}}>{item.book?.title||item.col.isbn}</div><div style={{fontSize:11,color:"#666"}}>{item.book?.author}</div></td>
            <td style={{fontSize:12}}>{item.lib.name}</td>
            <td><span style={{fontWeight:500,color:item.col.qty===0?"#A32D2D":item.col.qty<=1?"#854F0B":""}}>{item.col.qty}</span></td>
            <td><CondBadge c={item.col.condition}/></td>
            <td>{item.reasons.map((r,ri)=><div key={ri} style={{fontSize:11,color:"#666"}}>{r}</div>)}</td>
            <td style={{fontWeight:500}}>{item.suggestedQty}</td>
            <td><button style={{padding:"4px 10px",fontSize:11,whiteSpace:"nowrap"}} onClick={()=>addToQueue(item)} disabled={!item.book||!!queue.find(q=>q.isbn===item.book?.isbn)}>{queue.find(q=>q.isbn===item.book?.isbn)?"In queue":"+ Queue"}</button></td>
          </tr>
        ))}</tbody></table>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
// QUEUE
// ══════════════════════════════════════════════
function QueueTab({queue,setQueue,libraries,collections,setCollections,books,flash}){
  const [showAssign,setShowAssign]=useState(null);const [assignLib,setAssignLib]=useState("");const [assignQty,setAssignQty]=useState(1);const [saving,setSaving]=useState(false);
  async function rem(isbn){await db.deleteQueue(isbn);setQueue(q=>q.filter(x=>x.isbn!==isbn));flash("Removed from queue");}
  async function updNotes(isbn,notes){
    const item=queue.find(q=>q.isbn===isbn);if(!item)return;
    await db.upsertQueue({...item,notes});setQueue(q=>q.map(x=>x.isbn===isbn?{...x,notes}:x));
  }
  async function assign(){
    if(!assignLib||!showAssign)return;setSaving(true);
    const ex=collections.find(c=>c.libraryId===assignLib&&c.isbn===showAssign.isbn);
    const col={libraryId:assignLib,isbn:showAssign.isbn,qty:ex?ex.qty+Number(assignQty):Number(assignQty),condition:"Good",lastInventory:null};
    await db.upsertCollection(col);
    if(ex)setCollections(c=>c.map(x=>x.libraryId===assignLib&&x.isbn===showAssign.isbn?{...x,qty:col.qty}:x));
    else setCollections(c=>[...c,col]);
    await rem(showAssign.isbn);setShowAssign(null);setAssignLib("");setAssignQty(1);setSaving(false);flash("Assigned to library");
  }
  return(
    <div>
      <div style={{marginBottom:"1rem"}}>
        <h2 className="section-title" style={{margin:0}}>Staging Queue</h2>
        <div style={{fontSize:12,color:"#666",marginTop:2}}>Books sourced or flagged — not yet assigned to a library.</div>
      </div>
      {queue.length===0&&<div className="empty-state"><p>Queue is empty. Add books from Catalog or Restock tabs.</p></div>}
      <div style={{display:"grid",gap:10}}>
        {queue.map(item=>{const bk=books.find(b=>b.isbn===item.isbn)||item;return(
          <div key={item.isbn} className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:500}}>{bk.title}</div>
                <div style={{fontSize:12,color:"#666"}}>{bk.author} · {bk.format} · ${bk.msrp?.toFixed(2)}</div>
                <div style={{fontSize:11,fontFamily:"monospace",color:"#666",marginTop:2}}>{bk.isbn}</div>
                {item.queueDate&&<div style={{fontSize:11,color:"#666",marginTop:2}}>Added {item.queueDate}</div>}
                <input value={item.notes||""} onChange={e=>updNotes(item.isbn,e.target.value)} placeholder="Notes..." style={{marginTop:8,fontSize:12,padding:"4px 8px"}}/>
              </div>
              <div style={{display:"flex",gap:6,marginLeft:12,flexShrink:0}}>
                <button className="btn-primary" style={{fontSize:12,padding:"5px 10px"}} onClick={()=>{setShowAssign(item);setAssignLib("");setAssignQty(1);}}>Assign →</button>
                <button className="btn-danger" style={{padding:"5px 8px",fontSize:12}} onClick={()=>rem(item.isbn)}>✕</button>
              </div>
            </div>
          </div>
        );})}
      </div>
      {showAssign&&(<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setShowAssign(null)}}>
        <div className="modal">
          <div className="modal-title">Assign to Library</div>
          <div style={{marginBottom:"1rem",fontSize:14,fontWeight:500}}>{books.find(b=>b.isbn===showAssign.isbn)?.title||showAssign.title}</div>
          <div className="form-group"><label className="form-label">Library</label>
            <select value={assignLib} onChange={e=>setAssignLib(e.target.value)}><option value="">— select —</option>{libraries.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</select>
          </div>
          <div className="form-group"><label className="form-label">Quantity</label><input type="number" min="1" value={assignQty} onChange={e=>setAssignQty(e.target.value)} style={{width:80}}/></div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={()=>setShowAssign(null)}>Cancel</button>
            <button className="btn-success" onClick={assign} disabled={!assignLib||saving}>{saving?"Saving...":"Assign & Remove from Queue"}</button>
          </div>
        </div>
      </div>)}
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
